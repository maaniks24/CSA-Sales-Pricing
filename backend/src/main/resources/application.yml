spring:
  application:
    name: csa-pricing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/csa_pricing}
    username: ${DB_USER:csa}
    password: ${DB_PASSWORD:csa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ref-prefix: ${REF_PREFIX:LTPL}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
