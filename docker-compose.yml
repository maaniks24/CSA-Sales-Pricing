services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: csa_pricing
      POSTGRES_USER: csa
      POSTGRES_PASSWORD: csa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/csa_pricing
      DB_USER: csa
      DB_PASSWORD: csa
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
